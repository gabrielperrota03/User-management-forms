# Configuração versionada (sem segredos e sem nada de uma pessoa ou máquina).
# Por máquina: config/geral.local.yaml (fora do git) sobrescreve só as chaves que trouxer.

sap:
  conexao_e1p: '08 - UNISOL V2 - ECC - PRD - E1P'   # entrada do SAP Logon (a mesma do lock-users)
  conexao_o97: '001 - O97 : GRC : Production'
  sistema_grc: 'E1PCLNT010'

grc:
  url: 'https://sapo97.main.glb.corp.local:8401/ui2/nwbc/?sap-client=960&sap-language=EN&sap-nwbc-node=root&sap-theme=sap_corbu'
  cdp: 'http://127.0.0.1:9222'       # Chromium dedicado com --remote-debugging-port
  chrome: 'C:/dev/browsers/chrome-win64/chrome.exe'   # o mesmo do lock-users e do sox-automation
  perfil: 'C:/dev/browsers/perfil-sox'
  functional_area: 'EP- BRAZIL'
  user_group: 'BR-TEP'

pastas:
  insumos: '%OneDriveCommercial%\TEPBR-FINANCE - 1 - SOX\Insumos - Automação'
  solicitacoes: '%OneDriveCommercial%\TEPBR-FINANCE - 1 - SOX\Insumos - Automação\Solicitacoes de Acesso'
  estado: '%OneDriveCommercial%\TEPBR-FINANCE - 1 - SOX\Insumos - Automação\Gestao Usuarios\estado.json'
  lista_zbr: '%OneDriveCommercial%\TEPBR-FINANCE - 1 - SOX\Insumos - Automação\Gestao Usuarios\zbr_usuarios.json'
  relatorios: '%OneDriveCommercial%\TEPBR-FINANCE - 1 - SOX\Insumos - Automação\Relatorios Gestao Usuarios'

vigia:
  intervalo_s: 30

zbr:
  prefixo: 'ZBR'
  idade_max_dias: 8                  # lista semanal + folga; mais velha que isso = consulta o O97 para o IGG

# E1P › SUIM › Roles by Complex Selection Criteria (gravação do analista e inspeção ao vivo, 17/11/2026).
suim:
  arvore: 'wnd[0]/usr/cntlTREE_CONTROL_CONTAINER/shellcont/shell'
  nos_expandir: ['02  1      3', '03  2      1']
  no_relatorio: '04  2      2'
  titulo_selecao: 'Roles by Complex Selection Criteria'
  programa: 'RSUSR070'             # transação S_BCE_68001425
  campo_objeto: 'wnd[0]/usr/ctxtOBJ1'
  objeto: 'S_TCODE'
  campo_valor: 'wnd[0]/usr/txtVAL101'
  grade: 'wnd[0]/usr/cntlGRID1/shellcont/shell/shellcont[1]/shell'
  coluna_role: 'AGR_NAME'
  coluna_tipo: 'TYPE_ICON'         # '@IC\QSin...' = single
  coluna_descricao: 'AGR_TEXT'
  popups_permitidos: ['roles with missing authorization not']   # 'Information: N roles ... not displayed'

# GRC › Access Management › User Level Simulation (mapeado ao vivo em 17/11/2026). Rule Set é regra do analista: sempre este.
grc_risco:
  rule_set: 'EP - SOD 2019'
  somente_simulacao: true          # caixa 'Risk from Simulation only': só os riscos que a role traz
  sistema_criterio: 'E1PCLNT010'
  sistema_simulacao: 'E1P client 010 - Unisol'
  tipo_role: 'Technical Role'
  acao: 'Include'

# O97 › User x Business Roles Report (mapeado ao vivo em 19/11/2026). A filial é só a BR-TEP; o connector tira as roles de BW.
o97:
  transacao: 'Z_USER_BR'
  programa: 'AQZZZGRCREPORTS=Z_USER_BR'
  user_group: 'BR-TEP'
  connector: 'E1PCLNT010'

request:
  max_por_rodada: 3                  # disjuntor
  bloquear_com_conflito: true        # a confirmar com o analista

seguranca:
  dominios_permitidos: ['totalenergies.com', 'external.totalenergies.com']
  igg_protegidos: []                 # preencher no geral.local.yaml (ex.: o IGG de quem opera a rotina)
  max_transacoes: 10
